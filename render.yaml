services:
  # -------------------------------------------------------------------------
  # Backend: FastAPI, CPU-only inference (Free tier)
  # -------------------------------------------------------------------------
  - type: web
    name: retinagrade-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        sync: false

  # -------------------------------------------------------------------------
  # Frontend: Vite build, served as static files (Free tier)
  # -------------------------------------------------------------------------
  - type: web
    name: retinagrade-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false